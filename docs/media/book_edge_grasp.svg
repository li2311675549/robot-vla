<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700"><title>推书到桌边后，沿厚度上下夹持</title><desc>几何示意而非仿真截图。对齐算例中近边x为0.252米，向内15毫米的抓点为0.267米，桌边为0.280米。</desc><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse"><path d="M0 0L8 4L0 8" fill="#078b76"/></marker><marker id="b" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse"><path d="M0 0L8 4L0 8" fill="#2563eb"/></marker></defs><rect width="1200" height="700" rx="20" fill="#f5f8fc"/><g font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" fill="#16314a"><text x="38" y="44" font-size="27">为什么先推书，再从边缘夹厚度？</text><text x="38" y="74" font-size="15" fill="#526b82">侧视几何示意（公式算例，不是实验截图；图中厚度和夹爪外形为便于阅读绘制）</text><rect x="28" y="96" width="1144" height="222" rx="12" fill="#fff"/><text x="48" y="130" font-size="21">① 书完全在桌面上：下指没有进入书底的空间</text><rect x="392" y="224" width="756" height="68" rx="4" fill="#c7b59d"/><line x1="392" y1="224" x2="1148" y2="224" stroke="#946537" stroke-width="2"/><rect x="480" y="189" width="640" height="35" rx="4" fill="#427bba"/><text x="790" y="180" font-size="19">书</text><rect x="360" y="168" width="150" height="12" rx="4" fill="#475569"/><rect x="360" y="232" width="150" height="12" rx="4" fill="#475569"/><rect x="350" y="168" width="15" height="76" rx="4" fill="#475569"/><line x1="514" y1="255" x2="534" y2="235" stroke="#dc2626" stroke-width="2"/><line x1="514" y1="235" x2="534" y2="255" stroke="#dc2626" stroke-width="2"/><text x="686" y="264" font-size="18" fill="#b91c1c">下指与桌体冲突</text><line x1="920" y1="157" x2="745" y2="157" stroke="#078b76" stroke-width="2" marker-end="url(#a)"/><text x="875" y="151" font-size="16" fill="#078b76">推向桌边（−x）</text><text x="410" y="286" font-size="18" fill="#785e3f">桌体</text><rect x="28" y="334" width="1144" height="338" rx="12" fill="#fff"/><text x="48" y="370" font-size="21">② 只推到边缘露出：两指从侧面进入，沿厚度上下闭合</text><rect x="392" y="490" width="710" height="161" rx="4" fill="#c7b59d"/><line x1="392" y1="490" x2="1102" y2="490" stroke="#946537" stroke-width="2"/><rect x="280" y="455" width="640" height="35" rx="4" fill="#427bba"/><text x="724" y="442" font-size="17">大书：夹25mm厚度，不跨160mm宽度</text><rect x="125" y="435" width="218" height="12" rx="4" fill="#475569"/><rect x="125" y="498" width="218" height="12" rx="4" fill="#475569"/><rect x="112" y="435" width="18" height="75" rx="4" fill="#475569"/><line x1="332" y1="419" x2="332" y2="453" stroke="#078b76" stroke-width="2" marker-end="url(#a)"/><line x1="332" y1="533" x2="332" y2="492" stroke="#078b76" stroke-width="2" marker-end="url(#a)"/><line x1="53" y1="470" x2="256" y2="470" stroke="#2563eb" stroke-width="2" marker-end="url(#b)"/><text x="47" y="416" font-size="17" fill="#2563eb">接近方向 +x</text><circle cx="340" cy="472.5" r="5" fill="#ef4444"/><line x1="340" y1="460" x2="340" y2="614" stroke="#ef4444" stroke-width="2" stroke-dasharray="6 5"/><line x1="280" y1="456" x2="280" y2="574" stroke="#2563eb" stroke-width="2" stroke-dasharray="6 5"/><line x1="392" y1="420" x2="392" y2="649" stroke="#b66a19" stroke-width="2" stroke-dasharray="6 5"/><text x="465" y="548" font-size="20" fill="#785e3f">书的大部分仍由桌面支撑</text><line x1="600" y1="450" x2="600" y2="500" stroke="#334155" stroke-width="2" stroke-dasharray="6 5"/><text x="590" y="421" font-size="16">中心 x=0.332m</text><text x="49" y="574" font-size="16" fill="#2563eb">露出近边 x=0.252m</text><line x1="236" y1="570" x2="279" y2="570" stroke="#2563eb" stroke-width="2"/><text x="49" y="608" font-size="16" fill="#c2410c">抓点：近边向书内15mm，x=0.267m</text><line x1="340" y1="613" x2="385" y2="613" stroke="#ef4444" stroke-width="2"/><text x="432" y="637" font-size="16" fill="#785e3f">桌边 x=0.280m；抓点在桌边外13mm</text><text x="45" y="690" font-size="15" fill="#526b82">实际执行仍检查书本方向、支撑余量、指尖/腕部净空、双侧接触和抬升；不是固定坐标硬抓。</text></g></svg>