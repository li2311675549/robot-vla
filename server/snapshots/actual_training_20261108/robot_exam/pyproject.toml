[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "robot-exam"
version = "0.2.0"
description = "MuJoCo Husky A200 and original UR5 mobile manipulator"
requires-python = ">=3.10,<3.11"
dynamic = ["dependencies"]

[tool.setuptools.dynamic]
dependencies = {file = ["requirements.in"]}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-ra"
markers = ["stage2: physical mobile manipulator integration acceptance"]
